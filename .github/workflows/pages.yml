# Publishes the game as a static site on GitHub Pages.
# One-time setup (repo owner): Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Deploys on every push to main, or manually from the Actions tab (Run workflow).
# Only static files are published: index.html (legacy v0.1) and game/ (v0.3 renderer). No server, no data collection.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r game _site/game
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
