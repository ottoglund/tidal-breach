name: Game verification
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static tests
        run: python -m unittest discover -s tests -p "test_static*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: python tests/check_js_syntax.py
      - name: Install browser testing
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser tests (v0.1 classic)
        run: python -m pytest tests/test_browser.py -v
      - name: Browser tests (v0.2 renderer)
        run: python -m pytest tests/test_game_v2.py -v
